<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo sát bí mật 🤫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: #ffffff;
            padding-top: 100px;
            overflow: hidden;
        }
        h1 { font-size: 2rem; margin-bottom: 30px; }
        .btn-container { position: relative; height: 200px; }
        button {
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.1s;
        }
        #btn-yes { background-color: #4E9F3D; color: white; margin-right: 20px; }
        #btn-no { background-color: #D80032; color: white; position: absolute; }
    </style>
</head>
<body>

    <h1>Thành thật đi, Phúc có bị gay không? 🤫</h1>

    <div class="btn-container">
        <button id="btn-yes" onclick="alert('Biết ngay mà! Lo mà đi ăn bánh da lợn đi🤣')">Có, 100%!</button>
        <button id="btn-no" onmouseover="moveButton()" onclick="moveButton()">Không đời nào</button>
    </div>

    <script>
        function moveButton() {
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            const btnNo = document.getElementById('btn-no');
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }
    </script>
</body>
</html>
